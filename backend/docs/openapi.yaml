openapi: 3.0.3
info:
  title: TrustFeed API
  description: |
    A secure, production-style REST API with JWT authentication, role-based authorization,
    rate limiting, and clean layered architecture. Backend-only by design.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api/v1
    description: Versioned API prefix

security:
  - cookieAuth: []

tags:
  - name: Authentication
  - name: Posts
  - name: Movies

paths:
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /posts:
    $ref: './paths/posts.yaml#/collection'
  /posts/me:
    $ref: './paths/posts.yaml#/me'
  /posts/{id}:
    $ref: './paths/posts.yaml#/byId'
  /shows/movies:
    $ref: './paths/shows.yaml#/movies'

components:
  securitySchemes:
    $ref: './components/security.yaml'
  schemas:
    $ref: './components/schemas.yaml'
  responses:
    $ref: './components/responses.yaml'
