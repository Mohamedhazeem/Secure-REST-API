collection:
  post:
    tags:
      - Likes
    summary: Like a post
    operationId: likePost
    security:
      - cookieAuth: []
    description: Like a post on behalf of the authenticated user. Supports an optional `Idempotency-Key` header for safe retries. Re-liking an already liked post returns `409 Conflict`. Requires `likes:create` permission.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Post ID
      - name: Idempotency-Key
        in: header
        description: Client-generated key for idempotent like creation
        schema:
          type: string
          maxLength: 255
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LikeCreateRequest'
    responses:
      '201':
        description: Post liked
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Like'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '400':
        $ref: '../components/responses.yaml#/ValidationError'
      '409':
        description: Already liked
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  delete:
    tags:
      - Likes
    summary: Unlike a post
    operationId: unlikePost
    security:
      - cookieAuth: []
    description: Remove the authenticated user's like from a post. Requires `likes:delete` permission.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Post ID
    responses:
      '204':
        description: Post unliked
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

currentUser:
  get:
    tags:
      - Likes
    summary: Check if current user liked a post
    operationId: isPostLiked
    security:
      - cookieAuth: []
    description: Returns whether the authenticated user has liked the specified post. Requires `likes:read` permission.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Post ID
    responses:
      '200':
        description: Current user like status
        content:
          application/json:
            schema:
              type: object
              required:
                - liked
              properties:
                liked:
                  type: boolean
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
