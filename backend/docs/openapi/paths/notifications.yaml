notifications:
  get:
    tags:
      - Notifications
    summary: List own notifications
    operationId: listNotifications
    security:
      - cookieAuth: []
    description: Retrieve a paginated list of notifications for the authenticated user. Requires `notifications:read` permission.
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Paginated list of notifications
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedNotifications'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

markRead:
  patch:
    tags:
      - Notifications
    summary: Mark notification as read
    operationId: markNotificationRead
    security:
      - cookieAuth: []
    description: Mark a specific notification as read. Requires `notifications:update` permission and ownership of the notification.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Notification marked as read
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Notification'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
