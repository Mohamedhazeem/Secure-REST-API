Error:
  type: object
  required:
    - code
    - message
    - traceId
  properties:
    code:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - AUTH_REUSE_DETECTED
        - FORBIDDEN
        - ROLE_DENIED
        - OWNERSHIP_REQUIRED
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_CONFLICT
        - SELF_FOLLOW
        - RATE_LIMITED
        - DEPENDENCY_FAILURE
        - INTERNAL_ERROR
      description: Stable error code for programmatic handling
    message:
      type: string
      description: Human-readable explanation
    traceId:
      type: string
      description: Unique identifier for support investigation; echoes the X-Correlation-Id header

User:
  type: object
  required:
    - _id
    - username
    - email
  properties:
    _id:
      type: string
    id:
      type: string
      description: Alias of _id kept for client convenience
    username:
      type: string
    email:
      type: string

MessageResponse:
  type: object
  required:
    - message
  properties:
    message:
      type: string

RegisterResponse:
  type: object
  required:
    - message
    - user
  properties:
    message:
      type: string
    user:
      $ref: '#/User'

LoginResponse:
  type: object
  required:
    - message
    - user
  properties:
    message:
      type: string
    user:
      $ref: '#/User'

Post:
  type: object
  required:
    - _id
    - content
    - author
    - visibility
    - version
    - createdAt
  properties:
    _id:
      type: string
    content:
      type: string
      minLength: 1
      maxLength: 2000
    author:
      oneOf:
        - type: string
          description: Author id (single-document responses)
        - $ref: '#/AuthorSummary'
    visibility:
      type: string
      enum:
        - public
        - followers-only
        - private
    version:
      type: integer
      minimum: 0
      description: Optimistic lock counter; every update must present the version it read
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AuthorSummary:
  type: object
  required:
    - _id
    - username
    - email
  properties:
    _id:
      type: string
    username:
      type: string
    email:
      type: string

PostResponse:
  type: object
  required:
    - post
  properties:
    post:
      $ref: '#/Post'

Comment:
  type: object
  required:
    - _id
    - postId
    - authorId
    - content
    - createdAt
  properties:
    _id:
      type: string
    postId:
      type: string
    authorId:
      type: string
    content:
      type: string
    parentCommentId:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

Follow:
  type: object
  required:
    - _id
    - followerId
    - followingId
    - createdAt
  properties:
    _id:
      type: string
    followerId:
      type: string
    followingId:
      type: string
    createdAt:
      type: string
      format: date-time

Notification:
  type: object
  required:
    - _id
    - recipientId
    - actorId
    - actorName
    - action
    - targetSummary
    - deepLink
    - type
    - resourceId
    - read
    - createdAt
  properties:
    _id:
      type: string
    recipientId:
      type: string
    actorId:
      type: string
    actorName:
      type: string
    action:
      type: string
    targetSummary:
      type: string
    deepLink:
      type: string
      format: uri
    type:
      type: string
      enum:
        - follow
        - comment
        - like
    resourceId:
      type: string
    read:
      type: boolean
    createdAt:
      type: string
      format: date-time

Like:
  type: object
  required:
    - _id
    - userId
    - postId
    - createdAt
  properties:
    _id:
      type: string
    userId:
      type: string
    postId:
      type: string
    createdAt:
      type: string
      format: date-time

Session:
  type: object
  required:
    - id
    - userId
    - deviceFingerprint
    - ipAddress
    - userAgent
    - createdAt
    - expiresAt
  properties:
    id:
      type: string
    userId:
      type: string
    deviceFingerprint:
      type: string
    ipAddress:
      type: string
    userAgent:
      type: string
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time

RegisterRequest:
  type: object
  required:
    - username
    - email
    - password
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 30
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 8
      format: password

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password

UserUpdateRequest:
  type: object
  properties:
    displayName:
      type: string
    bio:
      type: string
    avatarUrl:
      type: string
      nullable: true
    privacy:
      type: object
      properties:
        profilePublic:
          type: boolean
        showFollows:
          type: boolean

PostCreateRequest:
  type: object
  required:
    - content
  properties:
    content:
      type: string
      minLength: 1
      maxLength: 2000
    visibility:
      type: string
      enum:
        - public
        - followers-only
        - private
      default: public

PostUpdateRequest:
  type: object
  required:
    - version
  properties:
    content:
      type: string
      minLength: 1
      maxLength: 2000
    visibility:
      type: string
      enum:
        - public
        - followers-only
        - private
    version:
      type: integer
      minimum: 0
      description: Version read from the last post response; a stale version returns 409

LikeCreateRequest:
  type: object
  required:
    - idempotencyKey
  properties:
    idempotencyKey:
      type: string
      description: Client-generated key for idempotent like creation

CommentCreateRequest:
  type: object
  required:
    - content
  properties:
    content:
      type: string
      maxLength: 1000
    parentCommentId:
      type: string
      nullable: true
    idempotencyKey:
      type: string
      description: Client-generated key for idempotent creation

PaginatedPosts:
  type: object
  required:
    - data
    - page
    - limit
    - total
  properties:
    data:
      type: array
      items:
        $ref: '#/Post'
    page:
      type: integer
    limit:
      type: integer
    total:
      type: integer

PaginatedComments:
  type: object
  required:
    - data
    - page
    - limit
    - total
  properties:
    data:
      type: array
      items:
        $ref: '#/Comment'
    page:
      type: integer
    limit:
      type: integer
    total:
      type: integer

PaginatedNotifications:
  type: object
  required:
    - data
    - page
    - limit
    - total
  properties:
    data:
      type: array
      items:
        $ref: '#/Notification'
    page:
      type: integer
    limit:
      type: integer
    total:
      type: integer

FeedPage:
  type: object
  required:
    - data
    - cursor
    - hasNextPage
  properties:
    data:
      type: array
      items:
        $ref: '#/Post'
    cursor:
      type: string
      description: Opaque cursor for the next page
    hasNextPage:
      type: boolean
