cookieAuth:
  type: apiKey
  in: cookie
  name: access_token
  description: |
    Short-lived access token issued at login/register/refresh. Sent as an
    HTTP-only cookie named `access_token`. Required on every protected route.

refreshCookieAuth:
  type: apiKey
  in: cookie
  name: refresh_token
  description: |
    Longer-lived refresh token issued at login/register and rotated on every
    refresh. Sent as an HTTP-only cookie named `refresh_token`. Used by the
    refresh endpoint to mint a new token pair.
