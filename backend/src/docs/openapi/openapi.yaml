openapi: 3.0.3
info:
  title: TrustFeed API
  description: |
    A secure, production-style social REST API with JWT authentication, role-based
    and attribute-based authorization, cursor-paginated feeds, comments, follows,
    notifications, and audit logging. Backend-only by design.

    This contract is the sole source of truth for integration (SC-001, SC-007).
    It is validated against the running application at startup and in CI.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC

servers:
  - url: /api/v1
    description: Versioned API prefix

security:
  - cookieAuth: []

x-cors:
  description: Cross-origin policy for browser clients (SC-010)
  allowOrigin:
    - Origin request header must exactly match an entry in the configured allowlist (ALLOWED_ORIGINS)
    - Requests without an Origin header (server-to-server) are never CORS-blocked
    - Disallowed origins receive no CORS response headers; the browser blocks the request
  allowCredentials: true
  allowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
  allowHeaders: [Content-Type, Authorization, Cookie, X-Correlation-Id, Idempotency-Key, If-Match]
  preflight:
    - Any OPTIONS request is answered with 204 before routing
    - CORS response headers are only set when the origin is allowed
  responseHeaders:
    Access-Control-Allow-Origin: echoed allowed origin
    Access-Control-Allow-Credentials: "true"
    Access-Control-Allow-Methods: GET,POST,PATCH,DELETE,OPTIONS
    Access-Control-Allow-Headers: Content-Type, Authorization, Cookie

x-correlation:
  description: Request correlation (FR-031)
  requestHeader: X-Correlation-Id
  requestHeaderUsage: Optional, up to 128 characters; control characters stripped; invalid values replaced with a generated UUID
  responseHeader: X-Correlation-Id
  responseHeaderUsage: Set on every response; echoed in logs and error envelopes as traceId

tags:
  - name: Authentication
    description: Registration, login, token refresh, logout, session management, and account deletion
  - name: Users
    description: Current user profile management
  - name: Posts
    description: Post creation, retrieval, update, and deletion
  - name: Comments
    description: Comments on posts
  - name: Likes
    description: Like and unlike posts, and check like status
  - name: Follows
    description: Following and unfollowing users
  - name: Feed
    description: Personalized post feed
  - name: Notifications
    description: Notification listing and read status
  - name: Health
    description: Liveness and readiness probes

paths:
  /auth:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /auth/sessions:
    $ref: './paths/auth.yaml#/sessions'
  /auth/sessions/{id}:
    $ref: './paths/auth.yaml#/sessionsById'
  /users/me:
    $ref: './paths/users.yaml#/me'
  /users/{id}/follow:
    $ref: './paths/follows.yaml#/follow'
  /users/{id}/unfollow:
    $ref: './paths/follows.yaml#/unfollow'
  /posts:
    $ref: './paths/posts.yaml#/collection'
  /posts/me:
    $ref: './paths/posts.yaml#/me'
  /posts/{id}:
    $ref: './paths/posts.yaml#/byId'
  /posts/{id}/comments:
    $ref: './paths/comments.yaml#/collection'
  /posts/{id}/likes:
    $ref: './paths/likes.yaml#/collection'
  /posts/{id}/likes/me:
    $ref: './paths/likes.yaml#/currentUser'
  /feed:
    $ref: './paths/feed.yaml#/feed'
  /notifications:
    $ref: './paths/notifications.yaml#/notifications'
  /notifications/{id}/read:
    $ref: './paths/notifications.yaml#/markRead'
  /health:
    $ref: './paths/health.yaml#/liveness'
  /health/ready:
    $ref: './paths/health.yaml#/readiness'

components:
  securitySchemes:
    $ref: './components/security.yaml'
  schemas:
    $ref: './components/schemas.yaml'
  responses:
    $ref: './components/responses.yaml'
  headers:
    $ref: './components/headers.yaml'
