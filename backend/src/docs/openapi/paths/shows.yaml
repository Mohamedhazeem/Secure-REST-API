movies:
  get:
    tags:
      - Movies
    summary: Paginated movies from read-only sample_mflix
    operationId: listMovies
    security:
      - cookieAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Paginated list of movies
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedMovies'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
