collection:
  get:
    tags:
      - Comments
    summary: List comments for a post
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Paginated list of comments
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedComments'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    tags:
      - Comments
    summary: Create a comment on a post
    security:
      - cookieAuth: []
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CommentCreateRequest'
    responses:
      '201':
        description: Comment created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Comment'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '400':
        $ref: '../components/responses.yaml#/ValidationError'
      '409':
        description: Idempotent replay; same response returned
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Comment'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
