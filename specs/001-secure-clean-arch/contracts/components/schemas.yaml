Error:
  type: object
  required:
    - code
    - message
    - traceId
  properties:
    code:
      type: string
      description: Stable error code for programmatic handling
    message:
      type: string
      description: Human-readable explanation
    traceId:
      type: string
      description: Unique identifier for support investigation

User:
  type: object
  required:
    - _id
    - username
    - email
    - roles
    - createdAt
  properties:
    _id:
      type: string
    username:
      type: string
    email:
      type: string
    roles:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          name:
            type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Post:
  type: object
  required:
    - _id
    - name
    - author
    - createdAt
  properties:
    _id:
      type: string
    name:
      type: string
    description:
      type: string
    age:
      type: integer
      minimum: 0
      maximum: 150
    author:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Role:
  type: object
  required:
    - _id
    - name
    - permissions
  properties:
    _id:
      type: string
    name:
      type: string
    permissions:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          code:
            type: string
          description:
            type: string

Permission:
  type: object
  required:
    - _id
    - code
  properties:
    _id:
      type: string
    code:
      type: string
    description:
      type: string

RegisterRequest:
  type: object
  required:
    - username
    - email
    - password
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 30
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 8
      format: password

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password

PostCreateRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      maxLength: 100
    description:
      type: string
      maxLength: 1000
    age:
      type: integer
      minimum: 0
      maximum: 150

PostUpdateRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 100
    description:
      type: string
      maxLength: 1000
    age:
      type: integer
      minimum: 0
      maximum: 150

PaginatedPosts:
  type: object
  required:
    - data
    - page
    - limit
    - total
  properties:
    data:
      type: array
      items:
        $ref: '#/Post'
    page:
      type: integer
    limit:
      type: integer
    total:
      type: integer
