<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="TrustFeed API cover image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a3a"/>
      <stop offset="100%" stop-color="#0a1326"/>
  </linearGradient>

    <radialGradient id="glowA" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
  </radialGradient>

    <radialGradient id="glowB" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>

    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4f7cff"/>
  </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
 </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5"/>
 </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
 </filter>
</defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accentLine)"/>

  <!-- Ambient gaussian-blur particles -->
  <g filter="url(#haze)" opacity="0.7">
    <circle cx="80"   cy="340" r="2"   fill="#22d3ee"/>
    <circle cx="40"   cy="240" r="2"   fill="#22d3ee"/>
    <circle cx="160"  cy="450" r="1.5" fill="#4f7cff"/>
    <circle cx="220"  cy="380" r="1.5" fill="#ffffff"/>
    <circle cx="120"  cy="320" r="2.5" fill="#22d3ee"/>
    <circle cx="190"  cy="500" r="2"   fill="#4f7cff"/>
    <circle cx="60"   cy="180" r="1.5" fill="#22d3ee"/>
    <circle cx="280"  cy="60"  r="2"   fill="#22d3ee"/>
    <circle cx="1060" cy="340" r="2"   fill="#22d3ee"/>
    <circle cx="1240" cy="240" r="2"   fill="#22d3ee"/>
    <circle cx="1140" cy="450" r="1.5" fill="#4f7cff"/>
    <circle cx="1080" cy="380" r="1.5" fill="#ffffff"/>
    <circle cx="1180" cy="320" r="2.5" fill="#22d3ee"/>
    <circle cx="1100" cy="500" r="2"   fill="#4f7cff"/>
    <circle cx="1260" cy="180" r="1.5" fill="#22d3ee"/>
    <circle cx="1010" cy="60"  r="2"   fill="#22d3ee"/>
    <circle cx="450"  cy="60"  r="1.8" fill="#4f7cff"/>
    <circle cx="850"  cy="80"  r="1.8" fill="#22d3ee"/>
</g>

  <!-- Subtle decorative concentric rings (corners) -->
  <g opacity="0.18" stroke="#22d3ee" fill="none">
    <circle cx="120" cy="120" r="50"/>
    <circle cx="120" cy="120" r="90"/>
    <circle cx="120" cy="120" r="130"/>
</g>
  <g opacity="0.18" stroke="#4f7cff" fill="none">
    <circle cx="1160" cy="540" r="50"/>
    <circle cx="1160" cy="540" r="90"/>
    <circle cx="1160" cy="540" r="130"/>
</g>

  <!-- Orbiting particles on the ring lines -->
  <g transform="translate(120 120)">
    <circle cx="50" cy="0" r="2.8" fill="#22d3ee" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
</circle>
    <circle cx="90" cy="0" r="2.2" fill="#ffffff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="12s" repeatCount="indefinite"/>
</circle>
    <circle cx="130" cy="0" r="2.8" fill="#22d3ee" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="16s" repeatCount="indefinite"/>
</circle>
</g>
  <g transform="translate(1160 540)">
    <circle cx="50" cy="0" r="2.8" fill="#4f7cff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
</circle>
    <circle cx="90" cy="0" r="2.2" fill="#ffffff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="200" to="-160" dur="14s" repeatCount="indefinite"/>
</circle>
    <circle cx="130" cy="0" r="2.8" fill="#4f7cff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="100" to="-260" dur="18s" repeatCount="indefinite"/>
</circle>
</g>

  <!-- Shield / lock emblem (centered) -->
  <g transform="translate(580,80)">
    <path d="M60 0 L120 22 V70 C120 110 95 140 60 158 C25 140 0 110 0 70 V22 Z"
          fill="url(#shieldFill)" opacity="0.95"/>
    <path d="M60 0 L120 22 V70 C120 110 95 140 60 158 C25 140 0 110 0 70 V22 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Lock body -->
    <rect x="38" y="64" width="44" height="36" rx="6" fill="#0b1020"/>
    <!-- Lock shackle -->
    <path d="M46 64 V52 a14 14 0 0 1 28 0 V64"
          fill="none" stroke="#0b1020" stroke-width="6" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="60" cy="80" r="4" fill="#22d3ee"/>
    <rect x="58" y="80" width="4" height="12" fill="#22d3ee"/>
</g>

  <!-- Eyebrow: tech stack with brand-color icons (centered) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">
    <!-- Node.js -->
    <circle cx="333" cy="284" r="5" fill="#339933"/>
    <text x="345" y="290">Node.js</text>
    <text x="435" y="290" text-anchor="middle" fill="#475569">·</text>
    <!-- Express 5 -->
    <circle cx="454" cy="284" r="5" fill="#e2e8f0"/>
    <text x="466" y="290">Express 5</text>
    <text x="579" y="290" text-anchor="middle" fill="#475569">·</text>
    <!-- MongoDB -->
    <circle cx="598" cy="284" r="5" fill="#47A248"/>
    <text x="610" y="290">MongoDB</text>
    <text x="701" y="290" text-anchor="middle" fill="#475569">·</text>
    <!-- Redis -->
    <circle cx="720" cy="284" r="5" fill="#DC382D"/>
    <text x="732" y="290">Redis</text>
    <text x="800" y="290" text-anchor="middle" fill="#475569">·</text>
    <!-- JWT -->
    <circle cx="818" cy="284" r="5" fill="#F7B928"/>
    <text x="830" y="290">JWT</text>
    <text x="876" y="290" text-anchor="middle" fill="#475569">·</text>
    <!-- RBAC -->
    <circle cx="893" cy="284" r="5" fill="#22d3ee"/>
    <text x="905" y="290">RBAC</text>
</g>

  <!-- Title (centered) -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="370" font-size="86" font-weight="800" fill="#ffffff">Trust Feed API</text>
    <text x="640" y="416" font-size="26" font-weight="500" fill="#cbd5e1">
      Clean architecture · Defense-in-depth security · Stable API contract
  </text>
</g>

  <!-- Divider (centered) -->
  <rect x="580" y="448" width="120" height="4" rx="2" fill="url(#accentLine)"/>

  <!-- Pill row: tech badges (centered) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <g transform="translate(262,496)">
      <rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="59" y="22" fill="#e2e8f0">JWT</text>
</g>
    <g transform="translate(390,496)">
      <rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="59" y="22" fill="#e2e8f0">RBAC</text>
</g>
    <g transform="translate(518,496)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="80" y="22" fill="#e2e8f0">Rate Limit</text>
</g>
    <g transform="translate(688,496)">
      <rect width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="100" y="22" fill="#e2e8f0">OpenAPI Contract</text>
</g>
    <g transform="translate(898,496)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="60" y="22" fill="#e2e8f0">SOLID</text>
</g>
</g>

  <!-- Footer (centered) -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#94a3b8" font-size="16" text-anchor="middle">
    <text x="640" y="600">v1.0 · /api/v1</text>
</g>
</svg>
